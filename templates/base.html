<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Моё приложение{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🚀 MyApp</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="btn btn-outline-light btn-sm">Профиль</a>
                <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light btn-sm">Выйти</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm">Войти</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-warning btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container my-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
